<text x="310.000" y="62.160" font-size="2.800" text-anchor="start" fill="#000000" font-weight="bold">ASSUMED SETTINGS</text>
<text x="310.000" y="65.940" font-size="2.200" text-anchor="start" fill="#000000">floor.thickness_mm = 114 mm: assumed: a 4-1/2 in (114 mm) SIP floor panel, the wall standard's thickness,</text>
<text x="310.000" y="68.910" font-size="2.200" text-anchor="start" fill="#000000">    research row sip.prs610_panel_thickness; Jim's floor build-up gives it</text>
<text x="310.000" y="71.880" font-size="2.200" text-anchor="start" fill="#000000">weather.u_value = 2.8 w_per_m2_k: assumed: typical double glazing, not chosen by Jim</text>
<text x="310.000" y="74.850" font-size="2.200" text-anchor="start" fill="#000000">weather.solar_heat_gain_coefficient = 0.6 ratio: assumed: typical double glazing, not chosen by Jim</text>
<text x="310.000" y="77.820" font-size="2.200" text-anchor="start" fill="#000000">weather.inside_celsius = 20 celsius: assumed design day</text>
<text x="310.000" y="80.790" font-size="2.200" text-anchor="start" fill="#000000">weather.outside_celsius = 0 celsius: assumed design day</text>
<text x="310.000" y="83.760" font-size="2.200" text-anchor="start" fill="#000000">weather.sun_watt_per_square_metre = 500 w_per_m2: assumed clear-sky peak; the solver applies it to</text>
<text x="310.000" y="86.730" font-size="2.200" text-anchor="start" fill="#000000">    every side</text>
<text x="310.000" y="89.700" font-size="2.200" text-anchor="start" fill="#000000">finish.mean_reflectance = 0.5 ratio: assumed mid-grey interior; Jim's wall finish gives it</text>
<text x="310.000" y="92.670" font-size="2.200" text-anchor="start" fill="#000000">finish.sky_angle_degrees = 65 degree: assumed open sky; the site gives it</text>
<text x="310.000" y="95.640" font-size="2.200" text-anchor="start" fill="#000000">envelope.wall_r = 20 r_value: assumed R-20 for a SIP wall (ft2 F h per BTU); the SIP thickness gives it</text>
<text x="310.000" y="98.610" font-size="2.200" text-anchor="start" fill="#000000">envelope.roof_r = 30 r_value: assumed R-30; the roof build-up gives it</text>
<text x="310.000" y="101.580" font-size="2.200" text-anchor="start" fill="#000000">envelope.floor_r = 20 r_value: assumed R-20; the floor build-up gives it</text>
<text x="310.000" y="104.550" font-size="2.200" text-anchor="start" fill="#000000">envelope.door_r = 5 r_value: assumed R-5 for an insulated door, not checked against a source</text>
<text x="310.000" y="107.520" font-size="2.200" text-anchor="start" fill="#000000">heating.boiler_efficiency = 0.7 ratio: assumed 70 percent; sources run 55 to 80 percent</text>
<text x="310.000" y="110.490" font-size="2.200" text-anchor="start" fill="#000000">joists.member_depth_mm = 140 mm: assumed 2x6; the beam solver says whether it is enough</text>
<text x="310.000" y="113.460" font-size="2.200" text-anchor="start" fill="#000000">joists.spacing_mm = 406 mm: 16 in on centre, assumed</text>
<text x="310.000" y="116.430" font-size="2.200" text-anchor="start" fill="#000000">header.plies = 2 count: assumed: two plies side by side, 3-1/2 in of LVL or 3 in of 2x lumber, fit inside the</text>
<text x="310.000" y="119.400" font-size="2.200" text-anchor="start" fill="#000000">    SIP's 3-5/8 in core (sip.prs610_core_thickness)</text>
<text x="310.000" y="122.370" font-size="2.200" text-anchor="start" fill="#000000">roof_loads.roof_dead_load_psf = 15 psf: assumed: 15 psf, the roof dead load Boise's roof-only header look-up</text>
<text x="310.000" y="125.340" font-size="2.200" text-anchor="start" fill="#000000">    assumes, research row gl.hdr.vl_lookup_roof_only; the roof build-up gives it</text>
<text x="310.000" y="128.310" font-size="2.200" text-anchor="start" fill="#000000">roof_loads.deflection_limit_ratio = 240 ratio: assumed: span over 240, the live-load deflection limit of Boise's</text>
<text x="310.000" y="131.280" font-size="2.200" text-anchor="start" fill="#000000">    header tables, research row gl.hdr.vl_limits, applied to the whole load</text>
<text x="310.000" y="134.250" font-size="2.200" text-anchor="start" fill="#000000">roof_loads.roof_bears_on =  compass_sides: assumed: the roof's 8 ft south hangover can only be carried by</text>
<text x="310.000" y="137.220" font-size="2.200" text-anchor="start" fill="#000000">    members running north-south across the south wall, so the roof bears on the south and north walls</text>
<text x="310.000" y="140.190" font-size="2.200" text-anchor="start" fill="#000000"></text>
