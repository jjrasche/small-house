<text x="10.000" y="248.000" font-size="3.400" text-anchor="start" fill="#000000">Small house on posts, from Jim's pencil sketch</text>
<text x="114.000" y="240.000" font-size="2.900" text-anchor="start" fill="#666666">SHEET</text>
