<text x="218.000" y="240.000" font-size="2.900" text-anchor="start" fill="#666666">SHEET NUMBER</text>
<text x="218.000" y="248.000" font-size="3.400" text-anchor="start" fill="#000000">A-1 of 6</text>
<text x="322.000" y="240.000" font-size="2.900" text-anchor="start" fill="#666666">DATE</text>
<text x="322.000" y="248.000" font-size="3.400" text-anchor="start" fill="#000000">2026-10-20</text>
<text x="10.000" y="258.000" font-size="2.900" text-anchor="start" fill="#666666">CONFIG COMMIT</text>
<text x="10.000" y="266.000" font-size="3.400" text-anchor="start" fill="#000000">c2a9df0</text>
<text x="114.000" y="258.000" font-size="2.900" text-anchor="start" fill="#666666">ENGINE PIN</text>
<text x="114.000" y="266.000" font-size="3.400" text-anchor="start" fill="#000000">we 02d17b7; rendered with we 073b001</text>
<text x="218.000" y="258.000" font-size="2.900" text-anchor="start" fill="#666666">SCALE</text>
<text x="218.000" y="266.000" font-size="3.400" text-anchor="start" fill="#000000">1:32 (3/8&quot; = 1'-0&quot;)</text>
<text x="322.000" y="258.000" font-size="2.900" text-anchor="start" fill="#666666">SOURCE</text>
<text x="322.000" y="266.000" font-size="3.400" text-anchor="start" fill="#000000">world-engine geometry; no line is drawn by hand</text>
