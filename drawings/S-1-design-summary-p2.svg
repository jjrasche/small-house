<text x="14.000" y="16.470" font-size="1.900" text-anchor="start" fill="#000000">flows:</text>
<text x="14.000" y="18.940" font-size="1.900" text-anchor="start" fill="#000000">dig-post-holes: ran 4 times; moved pieces_not_priced 4, post_holes_dug 4</text>
<text x="14.000" y="21.410" font-size="1.900" text-anchor="start" fill="#000000">set-floor-panels: ran 2 times; moved budget_usd -584.77, cost_usd 584.77, floor_panel_ft2_set 63.98</text>
<text x="14.000" y="23.880" font-size="1.900" text-anchor="start" fill="#000000">set-wall-panels: ran 12 times; moved budget_usd -3345.46, cost_usd 3345.46, wall_panel_ft2_set 366.02</text>
<text x="14.000" y="26.350" font-size="1.900" text-anchor="start" fill="#000000">set-roof-panels: ran 4 times; moved pieces_not_priced 1, roof_panel_ft2_set 216.01</text>
<text x="14.000" y="28.820" font-size="1.900" text-anchor="start" fill="#000000">set-posts: ran 0 times; moved </text>
<text x="14.000" y="31.290" font-size="1.900" text-anchor="start" fill="#000000">lay-subfloor: ran 0 times; moved </text>
<text x="14.000" y="33.760" font-size="1.900" text-anchor="start" fill="#000000">cut-openings: ran 0 times; moved </text>
<text x="14.000" y="36.230" font-size="1.900" text-anchor="start" fill="#000000">set-windows-and-door: ran 0 times; moved </text>
<text x="14.000" y="38.700" font-size="1.900" text-anchor="start" fill="#000000">frame-loft: ran 0 times; moved </text>
<text x="14.000" y="41.170" font-size="1.900" text-anchor="start" fill="#000000">install-boiler: ran 0 times; moved </text>
<text x="14.000" y="43.640" font-size="1.900" text-anchor="start" fill="#000000"></text>
<text x="14.000" y="47.020" font-size="2.600" text-anchor="start" fill="#000000" font-weight="bold">ASSUMPTIONS, EVERY SETTING WHOSE REASON SAYS IT IS ASSUMED</text>
<text x="14.000" y="49.490" font-size="1.900" text-anchor="start" fill="#000000">floor.thickness_mm = 114 mm; reason: assumed: a 4-1/2 in (114 mm) SIP floor panel, the wall standard's thickness, research row sip.prs610_panel_thickness; Jim's floor build-up gives it</text>
<text x="14.000" y="51.960" font-size="1.900" text-anchor="start" fill="#000000">weather.u_value = 2.8 w_per_m2_k; reason: assumed: typical double glazing, not chosen by Jim</text>
<text x="14.000" y="54.430" font-size="1.900" text-anchor="start" fill="#000000">weather.solar_heat_gain_coefficient = 0.6 ratio; reason: assumed: typical double glazing, not chosen by Jim</text>
<text x="14.000" y="56.900" font-size="1.900" text-anchor="start" fill="#000000">weather.inside_celsius = 20 celsius; reason: assumed design day</text>
<text x="14.000" y="59.370" font-size="1.900" text-anchor="start" fill="#000000">weather.outside_celsius = 0 celsius; reason: assumed design day</text>
<text x="14.000" y="61.840" font-size="1.900" text-anchor="start" fill="#000000">weather.sun_watt_per_square_metre = 500 w_per_m2; reason: assumed clear-sky peak; the solver applies it to every side</text>
<text x="14.000" y="64.310" font-size="1.900" text-anchor="start" fill="#000000">finish.mean_reflectance = 0.5 ratio; reason: assumed mid-grey interior; Jim's wall finish gives it</text>
<text x="14.000" y="66.780" font-size="1.900" text-anchor="start" fill="#000000">finish.sky_angle_degrees = 65 degree; reason: assumed open sky; the site gives it</text>
<text x="14.000" y="69.250" font-size="1.900" text-anchor="start" fill="#000000">envelope.wall_r = 20 r_value; reason: assumed R-20 for a SIP wall (ft2 F h per BTU); the SIP thickness gives it</text>
<text x="14.000" y="71.720" font-size="1.900" text-anchor="start" fill="#000000">envelope.roof_r = 30 r_value; reason: assumed R-30; the roof build-up gives it</text>
<text x="14.000" y="74.190" font-size="1.900" text-anchor="start" fill="#000000">envelope.floor_r = 20 r_value; reason: assumed R-20; the floor build-up gives it</text>
<text x="14.000" y="76.660" font-size="1.900" text-anchor="start" fill="#000000">envelope.door_r = 5 r_value; reason: assumed R-5 for an insulated door, not checked against a source</text>
<text x="14.000" y="79.130" font-size="1.900" text-anchor="start" fill="#000000">heating.boiler_efficiency = 0.7 ratio; reason: assumed 70 percent; sources run 55 to 80 percent</text>
<text x="14.000" y="81.600" font-size="1.900" text-anchor="start" fill="#000000">joists.member_depth_mm = 140 mm; reason: assumed 2x6; the beam solver says whether it is enough</text>
<text x="14.000" y="84.070" font-size="1.900" text-anchor="start" fill="#000000">joists.spacing_mm = 406 mm; reason: 16 in on centre, assumed</text>
<text x="14.000" y="86.540" font-size="1.900" text-anchor="start" fill="#000000">header.plies = 2 count; reason: assumed: two plies side by side, 3-1/2 in of LVL or 3 in of 2x lumber, fit inside the SIP's 3-5/8 in core (sip.prs610_core_thickness)</text>
<text x="14.000" y="89.010" font-size="1.900" text-anchor="start" fill="#000000">roof_loads.roof_dead_load_psf = 15 psf; reason: assumed: 15 psf, the roof dead load Boise's roof-only header look-up assumes, research row gl.hdr.vl_lookup_roof_only; the roof build-up gives it</text>
<text x="14.000" y="91.480" font-size="1.900" text-anchor="start" fill="#000000">roof_loads.deflection_limit_ratio = 240 ratio; reason: assumed: span over 240, the live-load deflection limit of Boise's header tables, research row gl.hdr.vl_limits, applied to the whole load</text>
<text x="14.000" y="93.950" font-size="1.900" text-anchor="start" fill="#000000">roof_loads.roof_bears_on = south, north compass_sides; reason: assumed: the roof's 8 ft south hangover can only be carried by members running north-south across the south wall, so the roof bears on the south and north walls</text>
<text x="14.000" y="96.420" font-size="1.900" text-anchor="start" fill="#000000"></text>
