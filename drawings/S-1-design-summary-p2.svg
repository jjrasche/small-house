<text x="14.000" y="214.460" font-size="2.900" text-anchor="start" fill="#000000">posts-under-floor [foundation]: PASS: every floor corner has a post under it; source: integrity: a floor on posts needs a post at each corner</text>
<text x="14.000" y="218.230" font-size="2.900" text-anchor="start" fill="#000000">walls-enclose-floor [walls]: PASS: walls close every edge of the floor; source: integrity: a shell closes every edge of its floor</text>
<text x="14.000" y="222.000" font-size="2.900" text-anchor="start" fill="#000000">roof-is-over-floor [roof]: PASS: a roof stands over the whole floor; source: integrity: a roof stands over the floor it keeps dry</text>
<text x="14.000" y="225.770" font-size="2.900" text-anchor="start" fill="#000000">egress-door-size [doors]: PASS: the egress door is at least as large as the limit; source: Michigan Residential Code 2015 R311.2, research row</text>
<text x="220.000" y="17.770" font-size="2.900" text-anchor="start" fill="#000000">      code.r311_2_door: side-hinged, 3 ft by 6 ft 8 in</text>
<text x="220.000" y="21.540" font-size="2.900" text-anchor="start" fill="#000000">posts-below-frost-line [foundation]: PASS: the posts are buried below the frost line; source: assumed: the frost depth the site gives; a footing must sit</text>
<text x="220.000" y="25.310" font-size="2.900" text-anchor="start" fill="#000000">      below it</text>
<text x="220.000" y="29.080" font-size="2.900" text-anchor="start" fill="#000000">roof-covers-floor [roof]: PASS: the roof covers the floor; source: Jim's what: the roof keeps the floor dry</text>
<text x="220.000" y="32.850" font-size="2.900" text-anchor="start" fill="#000000">headers-within-capacity [header_check]: PASS: every header is within its capacity; source: the header's catalog design values: bending, shear and its</text>
<text x="220.000" y="36.620" font-size="2.900" text-anchor="start" fill="#000000">      deflection limit</text>
<text x="220.000" y="40.390" font-size="2.900" text-anchor="start" fill="#000000">joists-span-the-deck [joists]: PASS: the joists span the deck at the stated spacing; source: integrity: a deck needs joists from edge to edge at the stated</text>
