<text x="280.000" y="17.400" font-size="3.400" text-anchor="start" fill="#000000" font-weight="bold">NOT MEASURED BY THE ENGINE</text>
<text x="280.000" y="21.990" font-size="2.900" text-anchor="start" fill="#000000">none</text>
<text x="280.000" y="25.905" font-size="2.900" text-anchor="start" fill="#000000"></text>
<text x="280.000" y="29.820" font-size="3.400" text-anchor="start" fill="#000000" font-weight="bold">ASSUMED SETTINGS</text>
<text x="280.000" y="34.410" font-size="2.900" text-anchor="start" fill="#000000">weather.inside_celsius = 20 celsius: assumed design day</text>
<text x="280.000" y="38.325" font-size="2.900" text-anchor="start" fill="#000000">weather.outside_celsius = 0 celsius: assumed design day</text>
<text x="280.000" y="42.240" font-size="2.900" text-anchor="start" fill="#000000">weather.sun_watt_per_square_metre = 500 w_per_m2: assumed clear-sky peak; the solver applies it to</text>
<text x="280.000" y="46.155" font-size="2.900" text-anchor="start" fill="#000000">    every side</text>
<text x="280.000" y="50.070" font-size="2.900" text-anchor="start" fill="#000000">finish.mean_reflectance = 0.5 ratio: assumed mid-grey interior; Jim's wall finish gives it</text>
<text x="280.000" y="53.985" font-size="2.900" text-anchor="start" fill="#000000">finish.sky_angle_degrees = 65 degree: assumed open sky; the site gives it</text>
<text x="280.000" y="57.900" font-size="2.900" text-anchor="start" fill="#000000">doors.offset_mm = 0 mm: assumed: the west end of the north wall; which end the door is at is open</text>
<text x="280.000" y="61.815" font-size="2.900" text-anchor="start" fill="#000000">joists.spacing_mm = 406 mm: assumed: 16 in on centre</text>
<text x="280.000" y="65.730" font-size="2.900" text-anchor="start" fill="#000000">ledgers.member_width_mm = null mm: assumed: a ledger cut from the joist stock, fastened to the wall's</text>
<text x="280.000" y="69.645" font-size="2.900" text-anchor="start" fill="#000000">    inside face; the fastening is not checked</text>
<text x="280.000" y="73.560" font-size="2.900" text-anchor="start" fill="#000000">ledgers.member_depth_mm = null mm: assumed: a ledger cut from the joist stock, as deep as the joists it</text>
<text x="280.000" y="77.475" font-size="2.900" text-anchor="start" fill="#000000">    carries</text>
<text x="280.000" y="81.390" font-size="2.900" text-anchor="start" fill="#000000">header.plies = 2 count: assumed: two plies side by side, 3-1/2 in of LVL or 3 in of 2x lumber, fit inside the</text>
<text x="280.000" y="85.305" font-size="2.900" text-anchor="start" fill="#000000">    SIP's 3-5/8 in core (sip.prs610_core_thickness)</text>
<text x="280.000" y="89.220" font-size="2.900" text-anchor="start" fill="#000000">roof_loads.roof_dead_load_psf = 15 psf: assumed: 15 psf, the roof dead load Boise's roof-only header</text>
<text x="280.000" y="93.135" font-size="2.900" text-anchor="start" fill="#000000">    look-up assumes, research row gl.hdr.vl_lookup_roof_only; the roof build-up gives it</text>
<text x="280.000" y="97.050" font-size="2.900" text-anchor="start" fill="#000000">roof_loads.deflection_limit_ratio = 240 ratio: assumed: span over 240, the live-load deflection limit of</text>
<text x="280.000" y="100.965" font-size="2.900" text-anchor="start" fill="#000000">    Boise's header tables, research row gl.hdr.vl_limits, applied to the whole load</text>
<text x="280.000" y="104.880" font-size="2.900" text-anchor="start" fill="#000000">roof_loads.roof_bears_on =  compass_sides: assumed: the roof's 8 ft south hangover can only be carried</text>
<text x="280.000" y="108.795" font-size="2.900" text-anchor="start" fill="#000000">    by members running north-south across the south wall, so the roof bears on the south and north walls</text>
<text x="280.000" y="112.710" font-size="2.900" text-anchor="start" fill="#000000"></text>
